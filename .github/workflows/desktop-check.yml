name: 桌面端自动检查

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查、测试和构建
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查主进程和 preload 类型
        run: pnpm exec tsc -p tsconfig.node.json --noEmit

      - name: 检查界面类型
        run: pnpm exec tsc -p tsconfig.web.json --noEmit

      - name: 运行自动测试
        run: pnpm test

      - name: 构建桌面程序
        run: pnpm build
